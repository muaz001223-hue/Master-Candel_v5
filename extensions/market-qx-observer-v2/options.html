<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Market-QX Observer connection</title><style>body{font-family:Verdana,sans-serif;max-width:620px;margin:40px auto;padding:20px;color:#192b32}label{display:block;margin:20px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #758a95;border-radius:4px}button{margin:20px 8px 0 0;padding:12px 20px;cursor:pointer}output{display:block;overflow-wrap:anywhere;margin-top:20px}textarea{height:180px}</style></head><body>
<h1 data-testid="observer-options-title">Market-QX Observer v2</h1>
<label for="backend">Backend URL</label><input id="backend" data-testid="observer-backend-url" type="url" required>
<label for="key">Ingestion service key</label><input id="key" data-testid="observer-service-key" type="password" autocomplete="off">
<label for="selectors">Visible DOM selector configuration (JSON)</label><textarea id="selectors" data-testid="observer-selectors" spellcheck="false"></textarea>
<button id="save" data-testid="observer-save-button">Save connection</button><button id="test" data-testid="observer-test-button">Test connection</button>
<output id="result" data-testid="observer-options-result" role="status"></output>
<output id="status" data-testid="observer-transport-status" role="status"></output>
<script src="options.js"></script></body></html>
